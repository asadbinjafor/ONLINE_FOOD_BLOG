<VirtualHost *:@PORT@>
    ServerName localhost
    DocumentRoot /var/www/app
    <Directory /var/www/app>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/public/.*\.php$ - [F,END]
    RewriteRule ^/(index\.php|health\.php)$ - [END]
    RewriteRule ^/public/(css|js|uploads)/ - [END]
    RewriteRule ^/ /index.php [END]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
